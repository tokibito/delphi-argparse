name: Run tests

on:
  - push

jobs:
  fpc:
    name: FPC (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Install FPC
        run: |
          sudo apt-get update
          sudo apt-get install -y lazarus lcl-utils
      - name: Checkout
        uses: actions/checkout@v7
      - name: build
        working-directory: ./src/fpc
        run: |
          make all
      - name: run tests
        working-directory: ./src/fpc
        run: |
          make test

  delphi:
    name: Delphi XE4 (Win32/Win64)
    runs-on: [self-hosted, Windows, X64]
    env:
      # Path to rsvars.bat of Delphi XE4 (BDS 11.0).
      # Can be overridden with the repository variable DELPHI_RSVARS.
      RSVARS: ${{ vars.DELPHI_RSVARS || 'C:\Program Files (x86)\Embarcadero\RAD Studio\11.0\bin\rsvars.bat' }}
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: build and run tests (make)
        working-directory: ./src/delphi
        run: |
          call "%RSVARS%" || exit /b 1
          make test || exit /b 1
      - name: build and run example (make)
        working-directory: ./src/delphi/Example
        run: |
          call "%RSVARS%" || exit /b 1
          make test || exit /b 1
      - name: build projects with msbuild
        working-directory: ./src/delphi
        run: |
          call "%RSVARS%" || exit /b 1
          for %%P in (Win32 Win64) do (
            msbuild ArgumentParserTest.dproj /t:Build /p:Config=Release /p:Platform=%%P /v:minimal || exit /b 1
            msbuild Example\ArgumentParserExample.dproj /t:Build /p:Config=Release /p:Platform=%%P /v:minimal || exit /b 1
          )
      - name: run tests (msbuild output)
        working-directory: ./src/delphi
        run: |
          Win32\Release\ArgumentParserTest.exe || exit /b 1
          Win64\Release\ArgumentParserTest.exe || exit /b 1
